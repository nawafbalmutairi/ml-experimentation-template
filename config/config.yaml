seed: 42

data:
  raw_path: data/raw/sample.csv
  processed_path: data/processed/dataset.csv
  target: churned

features:
  numerical:
    - tenure_months
    - monthly_charges
    - support_tickets
  categorical:
    - contract_type
    - region

split:
  test_size: 0.2

model:
  task: classification # classification | regression
  type: xgboost
  output_path: models/pipeline.joblib
  params:
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.1
    subsample: 0.9
    colsample_bytree: 0.9

validation:
  min_rows: 50
  max_missing_fraction: 0.2
  max_duplicate_fraction: 0.05
  min_class_fraction: 0.05
  report_dir: reports/data_quality
  value_ranges:
    tenure_months:
      min: 0
      max: 120
    monthly_charges:
      min: 0
    support_tickets:
      min: 0

evaluation:
  results_dir: experiments/results
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc

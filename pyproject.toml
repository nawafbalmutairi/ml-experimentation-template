[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-experimentation-template"
version = "0.1.0"
description = "A reusable template for tabular machine learning experimentation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pandas-stubs>=2.0",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[project.scripts]
ml-train = "ml_template.train:main"
ml-predict = "ml_template.predict:main"

[tool.hatch.build.targets.wheel]
packages = ["ml_template"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# scikit-learn's estimator API fixes these argument names. Renaming them would break the
# contract that lets the transformer sit inside a Pipeline and a cross-validation loop.
"ml_template/group_encoder.py" = ["N803"]

[tool.mypy]
files = ["ml_template", "tests", "scripts"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*", "xgboost.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
